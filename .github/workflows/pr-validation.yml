name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only validate the newest revision of a draft PR.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-libogg
      - name: Verify go.mod / go.sum are tidy
        shell: pwsh
        run: |
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          }
      - name: Check gofmt
        shell: pwsh
        run: |
          $files = git ls-files '*.go' | Where-Object { -not $_.StartsWith('frontend/') }
          $unformatted = gofmt -l $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            Write-Host "::error::gofmt needed for:"
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
      - name: Go vet
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2/mingw64/lib/pkgconfig"
          # Win32/COM uintptr->pointer casts are expected; skip unsafeptr.
          go vet -unsafeptr=false ./internal/...
      - name: Backend tests
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2/mingw64/lib/pkgconfig"
          go test ./internal/...
      - name: Targeted race tests
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2/mingw64/lib/pkgconfig"
          go test -race ./internal/transport ./internal/audio
      - name: Frontend tests
        shell: pwsh
        working-directory: frontend
        run: |
          # Match the existing release workflow: the checked-in lockfile is
          # currently out of sync with package.json, so npm ci cannot run.
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
